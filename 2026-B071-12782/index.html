<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <main class="calculator">
        <div class="display">0</div>

        <div class="keypad">
            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="00">00</button>
            <button class="function" data-action="percent">%</button>
            <button class="operator" data-action="divide">÷</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-action="multiply">×</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-action="subtract">−</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator" data-action="add">+</button>

            <button class="number zero" data-value="0">0</button>
            <button class="number" data-value=".">.</button>
            <button class="operator equal" data-action="equals">=</button>
        </div>
        <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #171717, #2f2f2f);
    display: flex;
    justify-content: center;
    align-items: center;
}

.calculator {
    width: 400px;
    background-color: black;
    border-radius: 50px;
    padding: 30px;
}
.display {
    width: 350px;
    height: 18vh;
    background-color: #45464b;
    border-radius: 35px;
    margin-bottom: 25px;
    font-size: 70px;
    text-align: right;
    padding-top: 50px;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}
.keypad {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 10px;
}

button {
    border: none;
    border-radius: 100px;
    font-size: 28px;
    cursor: pointer;
    color: white;
    background-color: #2f2f2f;
    width: 75px;
    height: 75px;
}
.operator {
    background-color: #ff9500;
}
.function {
    background-color: rgb(128, 128, 134);
}
.number {
    background-color: #505050;
}
.zero {
    grid-column: span 2;
    width: 100%;
    border-radius: 100px;
    text-align: left;
    padding-left: 25px;

}

    </style>
    </main>
</body>
</html>
